# Push to main → build linux bundle → deploy to Oracle VM.
# Secrets: ORACLE_HOST, ORACLE_SSH_USER, ORACLE_SSH_KEY, DATABASE_URL,
#          JWT_ACCESS_SECRET, CORS_ORIGINS (+ optional APP_PUBLIC_URL, etc.)
name: Deploy API to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners often hit Neon P1001 on direct endpoints; migrate on the Oracle VM instead.
      - name: Build linux bundle (Docker)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/app" -w /app node:22-bookworm \
            bash -ec 'npm ci && npm run build && npm prune --omit=dev'
          tar -czf athra-api-linux-amd64.tar.gz dist node_modules package.json package-lock.json prisma

      - name: Prepare Oracle SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          keyfile="$HOME/.ssh/oracle_deploy_key"

          normalize_keyfile() {
            tr -d '\r' < "$keyfile" | sed -e '1s/^\xEF\xBB\xBF//' -e '/^[[:space:]]*$/d' > "${keyfile}.norm"
            mv "${keyfile}.norm" "$keyfile"
          }

          write_raw_key() {
            local raw="$1"
            raw="${raw#\"}"; raw="${raw%\"}"
            raw="${raw//$'\\n'/$'\n'}"
            if [[ "$raw" == *$'\n'* ]] || [[ "$raw" == *'-----BEGIN'* ]]; then
              printf '%s' "$raw" > "$keyfile"
            else
              printf '%b' "$raw" > "$keyfile"
            fi
            normalize_keyfile
            try_unwrap_pem() {
              local oneline
              oneline="$(tr -d ' \n' < "$keyfile")"
              if [ "${#oneline}" -lt 200 ]; then
                return 1
              fi
              if printf '%s' "$oneline" | grep -qE '^[A-Za-z0-9+/=]+$'; then
                if printf '%s' "$oneline" | base64 -d > "${keyfile}.dec" 2>/dev/null; then
                  mv "${keyfile}.dec" "$keyfile"
                  normalize_keyfile
                  grep -q 'BEGIN .*PRIVATE KEY' "$keyfile" && return 0
                fi
                {
                  echo '-----BEGIN RSA PRIVATE KEY-----'
                  printf '%s' "$oneline" | fold -w 64
                  echo '-----END RSA PRIVATE KEY-----'
                } > "${keyfile}.wrap"
                if ssh-keygen -y -f "${keyfile}.wrap" > /dev/null 2>&1; then
                  mv "${keyfile}.wrap" "$keyfile"
                  normalize_keyfile
                  return 0
                fi
                rm -f "${keyfile}.wrap"
              fi
              return 1
            }
            if ! grep -q 'BEGIN .*PRIVATE KEY' "$keyfile"; then
              try_unwrap_pem || true
            fi
          }

          write_b64_key() {
            local b64
            b64="$(printf '%s' "$1" | tr -d '\n\r\t ')"
            if ! printf '%s' "$b64" | base64 -d > "$keyfile" 2>/dev/null; then
              if ! printf '%s' "$b64" | openssl base64 -d -A > "$keyfile" 2>/dev/null; then
                return 1
              fi
            fi
            normalize_keyfile
            return 0
          }

          key_ok() {
            grep -qE 'BEGIN (ENCRYPTED )?(RSA |EC |DSA |OPENSSH )?PRIVATE KEY' "$keyfile" \
              && ! grep -qE '^ssh-(rsa|ed25519|ecdsa)[[:space:]]' "$keyfile" \
              && ssh-keygen -y -f "$keyfile" > /dev/null 2>&1
          }

          source_used=""
          if [ -n "${ORACLE_SSH_KEY_B64:-}" ]; then
            if write_b64_key "$ORACLE_SSH_KEY_B64" && key_ok; then
              source_used="ORACLE_SSH_KEY_B64"
            elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
              echo "::warning::ORACLE_SSH_KEY_B64 invalid or not a private key; trying ORACLE_SSH_KEY."
              write_raw_key "$ORACLE_SSH_KEY"
              source_used="ORACLE_SSH_KEY"
            else
              echo "::error::ORACLE_SSH_KEY_B64 invalid. On Mac: ./scripts/encode-oracle-ssh-secret.sh ~/Downloads/ssh-key-*.key"
              exit 1
            fi
          elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
            write_raw_key "$ORACLE_SSH_KEY"
            source_used="ORACLE_SSH_KEY"
          else
            echo "::error::Set ORACLE_SSH_KEY_B64 (recommended) or ORACLE_SSH_KEY. See scripts/encode-oracle-ssh-secret.sh"
            exit 1
          fi

          chmod 600 "$keyfile"
          if ! key_ok; then
            bytes="$(wc -c < "$keyfile" | tr -d ' ')"
            b64_chars="$(printf '%s' "${ORACLE_SSH_KEY_B64:-}" | wc -c | tr -d ' ')"
            raw_chars="$(printf '%s' "${ORACLE_SSH_KEY:-}" | wc -c | tr -d ' ')"
            has_begin="no"
            grep -q 'BEGIN .*PRIVATE KEY' "$keyfile" && has_begin="yes"
            looks_public="no"
            grep -qE '^ssh-(rsa|ed25519|ecdsa)[[:space:]]' "$keyfile" && looks_public="yes"
            echo "::error::SSH key from ${source_used} invalid (pem_bytes=${bytes}, begin_private_key=${has_begin}, looks_public=${looks_public})."
            echo "::error::GitHub secret sizes (chars): ORACLE_SSH_KEY_B64=${b64_chars}, ORACLE_SSH_KEY=${raw_chars}. Oracle RSA .key → B64 one line is usually ~2200 chars, PEM file ~1600 bytes."
            echo "::error::Delete both SSH secrets, then set only ORACLE_SSH_KEY_B64 from: ./scripts/encode-oracle-ssh-secret.sh ~/Downloads/ssh-key-2026-11-23.key"
            echo "::error::Not .pub (399 chars). Passphrase-protected keys fail in CI."
            exit 1
          fi
          echo "SSH private key OK (${source_used})."

      - name: Upload bundle to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key_path: /home/runner/.ssh/oracle_deploy_key
          source: "athra-api-linux-amd64.tar.gz,scripts/oracle-bootstrap-prebuilt.sh"
          target: /tmp/

      - name: Install on VM and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          FITCORE_AUTOMATION_SECRET: ${{ secrets.FITCORE_AUTOMATION_SECRET }}
          ATHRA_AUTOMATION_SECRET: ${{ secrets.ATHRA_AUTOMATION_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key_path: /home/runner/.ssh/oracle_deploy_key
          envs: >-
            DATABASE_URL,MIGRATE_DATABASE_URL,JWT_ACCESS_SECRET,CORS_ORIGINS,APP_PUBLIC_URL,
            FITCORE_AUTOMATION_SECRET,ATHRA_AUTOMATION_SECRET,
            RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET
          script: |
            set -euo pipefail
            export BUNDLE=/tmp/athra-api-linux-amd64.tar.gz
            chmod +x /tmp/scripts/oracle-bootstrap-prebuilt.sh
            bash /tmp/scripts/oracle-bootstrap-prebuilt.sh

      - name: Public health check
        run: |
          sleep 5
          curl -fsS --max-time 30 "http://${{ secrets.ORACLE_HOST }}:3001/api/v1/health"