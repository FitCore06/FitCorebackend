# Push to main → build linux bundle → deploy to Oracle VM.
# Secrets: ORACLE_HOST, ORACLE_SSH_USER, ORACLE_SSH_KEY, DATABASE_URL,
#          JWT_ACCESS_SECRET, CORS_ORIGINS (+ optional APP_PUBLIC_URL, etc.)
name: Deploy API to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners often hit Neon P1001 on direct endpoints; migrate on the Oracle VM instead.
      - name: Build linux bundle (Docker)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/app" -w /app node:22-bookworm \
            bash -ec 'npm ci && npm run build && npm prune --omit=dev'
          tar -czf athra-api-linux-amd64.tar.gz dist node_modules package.json package-lock.json prisma

      - name: Prepare Oracle SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          keyfile="$HOME/.ssh/oracle_deploy_key"
          if [ -n "${ORACLE_SSH_KEY_B64:-}" ]; then
            b64="$(printf '%s' "$ORACLE_SSH_KEY_B64" | tr -d '\n\r\t ')"
            if ! printf '%s' "$b64" | base64 -d > "$keyfile" 2>/dev/null; then
              if ! printf '%s' "$b64" | openssl base64 -d -A > "$keyfile" 2>/dev/null; then
                echo "::error::ORACLE_SSH_KEY_B64 invalid. On Mac run: ./scripts/encode-oracle-ssh-secret.sh ~/Downloads/ssh-key-2026-11-23.key"
                exit 1
              fi
            fi
          elif [ -n "${ORACLE_SSH_KEY:-}" ]; then
            # GitHub Secrets may contain either real multiline text or literal \n escape sequences.
            raw_key="${ORACLE_SSH_KEY//$'\\n'/\n}"
            printf '%b' "$raw_key" > "$keyfile"
            printf '\n' >> "$keyfile"
          else
            echo "::error::Set ORACLE_SSH_KEY (private PEM/OpenSSH key) or ORACLE_SSH_KEY_B64 in repository secrets."
            exit 1
          fi

          chmod 600 "$keyfile"
          if grep -qE '^-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----$|^ssh-(rsa|ed25519|ecdsa)' "$keyfile"; then
            :
          else
            echo "::error::SSH key secret is missing a private-key header or is a public key. Store the private key contents, not the .pub file."
            exit 1
          fi
          if ! ssh-keygen -y -f "$keyfile" > /dev/null 2>&1; then
            echo "::error::SSH key invalid (ssh: no key found). Use the private key BEGIN…END block, not .pub."
            exit 1
          fi
          echo "SSH private key OK."

      - name: Upload bundle to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key_path: /home/runner/.ssh/oracle_deploy_key
          source: "athra-api-linux-amd64.tar.gz,scripts/oracle-bootstrap-prebuilt.sh"
          target: /tmp/

      - name: Install on VM and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          FITCORE_AUTOMATION_SECRET: ${{ secrets.FITCORE_AUTOMATION_SECRET }}
          ATHRA_AUTOMATION_SECRET: ${{ secrets.ATHRA_AUTOMATION_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key_path: /home/runner/.ssh/oracle_deploy_key
          envs: >-
            DATABASE_URL,MIGRATE_DATABASE_URL,JWT_ACCESS_SECRET,CORS_ORIGINS,APP_PUBLIC_URL,
            FITCORE_AUTOMATION_SECRET,ATHRA_AUTOMATION_SECRET,
            RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET
          script: |
            set -euo pipefail
            export BUNDLE=/tmp/athra-api-linux-amd64.tar.gz
            chmod +x /tmp/scripts/oracle-bootstrap-prebuilt.sh
            bash /tmp/scripts/oracle-bootstrap-prebuilt.sh

      - name: Public health check
        run: |
          sleep 5
          curl -fsS --max-time 30 "http://${{ secrets.ORACLE_HOST }}:3001/api/v1/health"