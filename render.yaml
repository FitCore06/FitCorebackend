# Render Blueprint — Athra API (NestJS + Prisma → Supabase Postgres)
#
# Build: generate Prisma client + compile only (no DB).
# Migrations: explicit — npm run render:migrate (session pooler DATABASE_URL).
# Optional per deploy: preDeployCommand: npm run render:migrate
#
# Membership expiry: ATHRA_* env (FITCORE_* still honored). Cron ~9am IST.
# Trigger: POST /api/v1/automation/membership-expiry/run + ATHRA_AUTOMATION_SECRET header X-Athra-Automation-Secret.
services:
  - type: web
    name: fitcore-api
    runtime: node
    repo: https://github.com/FitCore06/FitCorebackend
    branch: main
    plan: free
    region: singapore
    buildCommand: npm run render:build
    preDeployCommand: npm run render:migrate
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH_STUB
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FITCORE_MEMBERSHIP_EXPIRY_CRON_ENABLED
        value: true
      - key: FITCORE_GYM_SLUG
        sync: false
      - key: FITCORE_EXPIRY_NOTIFY_DAYS
        value: 7,3,1,0
      - key: FITCORE_AUTOMATION_SECRET
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false