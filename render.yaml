# Render Blueprint — FitCore API (NestJS + Prisma → Supabase Postgres)
#
# Build: generate Prisma client + compile only (no DB).
# Migrations: explicit — npm run render:migrate (session pooler DATABASE_URL).
# Optional per deploy: preDeployCommand: npm run render:migrate
#
# Membership expiry reminders: FITCORE_MEMBERSHIP_EXPIRY_CRON_ENABLED=true (~9am IST in-process).
# Optional trigger: POST /api/v1/automation/membership-expiry/run + FITCORE_AUTOMATION_SECRET.
# Env: FITCORE_GYM_SLUG, FITCORE_EXPIRY_NOTIFY_DAYS, EXPO_ACCESS_TOKEN (push).
services:
  - type: web
    name: fitcore-api
    runtime: node
    repo: https://github.com/FitCore06/FitCorebackend
    branch: main
    plan: free
    region: singapore
    buildCommand: npm run render:build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH_STUB
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false